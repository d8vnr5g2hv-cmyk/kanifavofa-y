<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060914">
<title>HALO LINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Barlow+Condensed:ital,wght@0,500;0,700;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hl.css?v=5.1">
<link rel="stylesheet" href="ycard.css?v=5.1">
</head>
<body data-scr="title">

<button id="hlClose" aria-label="閉じる">×<small>Card Shop へ</small></button>

<!-- ===== タイトル ===== -->
<section class="scr on" id="title">
  <div class="t-bg"></div>
  <div class="t-logo"><span>HALO</span><b>LINK</b><small>MY CARD BATTLE</small></div>
  <div class="t-load"><i id="tBar"></i></div>
  <p class="t-start" id="tStart">TAP TO START</p>
</section>

<!-- ===== ステージ ===== -->
<section class="scr" id="stage">
  <div class="sc-bg" style="background-image:url(hl_bg_sand.webp)"></div>
  <header class="hd in"><div><em>OPERATION</em><b>作戦</b></div><div class="res"><span>記章</span><b id="stBadge">0</b><span>クリア</span><b id="stClear">0</b></div></header>
  <div class="st-scroll">
    <div class="sg-list in" id="sgList"></div>
    <div class="st-info in" id="stInfo"></div>
    <p class="lab in">TEAM<button class="mini" id="stEdit">編成を変える</button></p>
    <div class="st-party in" id="stParty"></div>
    <div class="st-deckinfo in" id="stDeck"></div>
    <div class="st-act in"><button class="btn main big" id="stGo"></button><button class="btn sub" id="stHard">HARD</button></div>
    <p class="lab in">PASSIVE<small>記章で永続の特性を解放</small></p>
    <div class="st-pass in" id="stPass"></div>
  </div>
</section>

<!-- ===== 編成 ===== -->
<section class="scr" id="team">
  <div class="sc-bg dark" style="background-image:url(hl_bg_home.webp)"></div>
  <header class="hd in"><div><em>TEAM</em><b>編成</b></div><button class="mini" id="tmBack">もどる</button></header>
  <div class="dk-scroll">
    <p class="lab in">TEAM<small>枠をタップ → 下から入れる子を選ぶ。左が前列（攻撃を受ける）</small></p>
    <div class="dk-team in" id="dkTeam"></div>
    <div class="dk-syn in" id="dkSyn"></div>
    <p class="lab in">MEMBERS<small>デッキにカードがある子ほど活躍できる</small></p>
    <div class="tm-pool in" id="dkPool"></div>
  </div>
</section>

<!-- ===== マップ ===== -->
<section class="scr" id="map">
  <div class="sc-bg" style="background-image:url(hl_bg_sand.webp)"></div>
  <header class="hd"><div><em>MAP</em><b id="mDiff"></b></div><div class="res"><span>記章</span><b id="mBadge">0</b></div></header>
  <div class="m-party" id="mParty"></div>
  <div class="m-map" id="mMap"></div>
  <div class="m-bar"><button class="btn sub" id="mDeckBtn">デッキ <b id="mDeck">0</b>枚</button><button class="btn sub" id="mSettle">精算して終わる</button></div>
</section>

<!-- ===== バトル ===== -->
<section class="scr" id="battle">
  <div class="b-field" id="bField">
    <div class="b-bg"></div>
    <div class="b-head">
      <button class="mini" id="bRetreat">メニュー</button>
      <span class="b-stage" id="bStage"></span>
      <span class="b-wave"><b id="bWave">BATTLE</b></span>
    </div>
    <div id="bEnemies"></div>
    <div class="b-syn" id="bSyn"></div>
    <div class="b-party" id="bParty"></div>
    <div class="b-me">
      <div class="b-block" id="bBlock"><svg viewBox="0 0 24 24"><path d="M12 2l9 3v6c0 6-4 10-9 11C7 21 3 17 3 11V5z"/></svg><b>0</b></div>
      <div class="b-chain" id="bChain"></div>
      <div class="b-st" id="bSt"></div>
    </div>
    <div id="bBanner"></div>
    <div id="bTurn"></div>
    <div id="bFlash"></div>
  </div>
  <div class="b-bar">
    <div class="b-energy" id="bEnergy"><b>3</b><small>/3</small></div>
    <button class="b-pile" id="bPileD"><i>山札</i><b id="bDraw">0</b></button>
    <button class="b-pile" id="bPileX"><i>捨て札</i><b id="bDisc">0</b></button>
    <button class="b-end" id="bEnd">ターン終了</button>
  </div>
  <div id="hand"></div>
  <div id="preview"></div>
</section>

<div id="cut"><div class="c-bg"></div><i class="c-s1"></i><i class="c-s2"></i><div class="c-art"><img alt=""></div>
  <div class="c-txt"><span class="cn"></span><b class="cs"></b><p class="cd"></p></div></div>
<div id="rv"></div>
<div id="over"></div>
<div id="toast"></div>

<script src="hl_core.js?v=5.1"></script>
<script src="ycard.js?v=5.1"></script>
<script src="hl_data.js?v=5.1"></script>
<script src="hl_run.js?v=5.1"></script>
<script src="hl_battle.js?v=5.1"></script>
<script src="hl_ui.js?v=5.1"></script>
</body>
</html>
